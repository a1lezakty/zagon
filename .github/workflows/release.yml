name: release

# A tag v* builds everything and publishes a GitHub Release. Run by hand (workflow_dispatch) it only builds the
# artifacts: nothing is published. How to cut a version: docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test build, e.g. 0.1.0 (artifacts only, no release)'
        required: true
        default: '0.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # same SDK as core.yml and scripts/dev.sh
  SDK_URL: https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  SDK_SUM: cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
  SDKS: .build-sdks
  MAX_STATIC_BYTES: 20000000

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          case $GITHUB_REF in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; *) v=$INPUT ;; esac
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be x.y.z, got '$v'"; exit 1; }
          # above every other v* tag: zagon update takes whatever `latest` is, and Sparkle's build number only grows
          last=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's#.*refs/tags/v##' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$v" | sort -V | tail -1)
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::version $v is not above the last tag v$last"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Release notes: the tag's annotation, else the commits since the previous tag (for a manual run: up to HEAD).
  # Built first: the macOS job puts them into appcast.xml (Sparkle's update alert).
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          ref=HEAD
          case $GITHUB_REF in refs/tags/v*)
            ref=$GITHUB_REF_NAME
            git fetch --force origin "refs/tags/$ref:refs/tags/$ref" ;;  # the annotated tag object, not a lightweight copy
          esac
          if [ "$(git cat-file -t "$ref")" = tag ]; then
            { git tag -l --format='%(contents:subject)' "$ref"; echo; git tag -l --format='%(contents:body)' "$ref"; } > notes.md
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$ref^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$ref" > notes.md
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: swift:6.4.1-bookworm
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: |
          sed -i "s/^let zagonVersion = \"dev\"$/let zagonVersion = \"$VERSION\"/" Sources/zagon/Version.swift
          grep -qF "\"$VERSION\"" Sources/zagon/Version.swift
      - name: Static Linux SDK (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDKS }}
          key: static-linux-sdk-${{ env.SDK_SUM }}
      - name: Install the SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: swift sdk install "$SDK_URL" --checksum "$SDK_SUM" --swift-sdks-path "$SDKS"
      - name: Build static (x86_64, aarch64)
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            set -- -c release --swift-sdks-path "$SDKS" --swift-sdk "$arch-swift-linux-musl"
            swift build "$@" -Xlinker -s --product zagon
            cp "$(swift build "$@" --show-bin-path)/zagon" "dist/zagon-linux-$arch"
          done
      - name: Size guard and version
        run: |
          for f in dist/zagon-linux-*; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes (limit $MAX_STATIC_BYTES)"
            [ "$size" -le "$MAX_STATIC_BYTES" ] || { echo "::error::$f is over the limit (Foundation imported?)"; exit 1; }
          done
          [ "$(dist/zagon-linux-x86_64 --version)" = "$VERSION" ] || { echo "::error::--version is not $VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  macos:
    needs: [version, notes]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: |
          sed -i '' "s/^let zagonVersion = \"dev\"$/let zagonVersion = \"$VERSION\"/" Sources/zagon/Version.swift
          grep -qF "\"$VERSION\"" Sources/zagon/Version.swift
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      # Contract with apps/macos: release-mac.sh <version> <build> [notes.md] leaves Zagon.dmg, Zagon.zip (the Sparkle
      # update) and appcast.xml (signed with SPARKLE_ED_PRIVATE_KEY, enclosure
      # https://github.com/<repo>/releases/download/v<version>/Zagon.zip, the notes inside) in apps/macos/build/.
      - name: App, DMG, appcast
        working-directory: apps/macos
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release-mac.sh "$VERSION" "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/notes/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/macos/build/Zagon.dmg
            apps/macos/build/Zagon.zip
            apps/macos/build/appcast.xml
          if-no-files-found: error

  # Every release file, checked, plus SHA256SUMS: one artifact, on manual runs too.
  bundle:
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: assets
      - name: Check the files, SHA256SUMS
        working-directory: assets
        run: |
          for f in zagon-linux-x86_64 zagon-linux-aarch64 Zagon.dmg Zagon.zip appcast.xml; do
            [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          if ! grep -q 'sparkle:edSignature="' appcast.xml || ! grep -qF "/releases/download/v$VERSION/Zagon.zip" appcast.xml; then
            echo "::error::appcast.xml is not signed or points to another release"; exit 1
          fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: assets/
          if-no-files-found: error

  # Installed copies read releases/latest: zagon update and install.sh take SHA256SUMS and the binary, Zagon.app takes
  # appcast.xml. So the release is published (not a draft or prerelease) and checked to be `latest` with every file.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, notes, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: notes
      # gh creates it as a draft, uploads, then publishes; never --draft / --prerelease, those are not `latest`.
      # A re-run (Re-run failed jobs) finds the release, maybe a draft left by a failed upload: re-upload, publish.
      - name: Publish
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" assets/* --title "Zagon $VERSION" --notes-file notes.md --verify-tag --latest
          fi
      - name: Check that releases/latest is this release, with appcast.xml
        run: |
          for _ in 1 2 3 4 5; do
            gh api "repos/$GH_REPO/releases/latest" | jq -e --arg t "$GITHUB_REF_NAME" \
              '.tag_name == $t and ([.assets[].name] | index("appcast.xml") and index("SHA256SUMS"))' > /dev/null &&
              curl -fsSL -o /dev/null "https://github.com/$GH_REPO/releases/latest/download/appcast.xml" &&
              curl -fsSL "https://github.com/$GH_REPO/releases/latest/download/SHA256SUMS" | grep -q zagon-linux-x86_64 &&
              exit 0
            sleep 10
          done
          echo "::error::releases/latest is not $GITHUB_REF_NAME with appcast.xml and SHA256SUMS"; exit 1
