name: macos

# Work branches run by hand (workflow_dispatch): a push there starts no CI.
on:
  push:
    branches: [main]
    paths: ['apps/macos/**', 'Sources/**', 'Package.swift', 'Tests/ZagonCoreTests/Fixtures/scenario/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['apps/macos/**', 'Sources/**', 'Package.swift', 'Tests/ZagonCoreTests/Fixtures/scenario/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

# a push and the pull request of the same branch share one group
concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Snapshots
        run: swift run Zagon --snapshots build/snapshots --fixtures ../../Tests/ZagonCoreTests/Fixtures/scenario
      # Runs started by hand get the Sparkle key and build the release set (DMG, signed update zip, appcast); the
      # releases themselves come from release.yml.
      - name: App, DMG, update zip and appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then scripts/release-mac.sh "0.1.0" "${{ github.run_number }}"
          else scripts/build-app.sh "0.1.0" "${{ github.run_number }}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: apps/macos/build/snapshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Zagon-dmg
          path: |
            apps/macos/build/Zagon.dmg
            apps/macos/build/Zagon.zip
            apps/macos/build/appcast.xml
          if-no-files-found: error
