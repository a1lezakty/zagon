name: macos

# Work branches run by hand (workflow_dispatch): a push there starts no CI.
on:
  push:
    branches: [main]
    paths: ['apps/macos/**', 'Sources/**', 'Package.swift', 'Tests/ZagonCoreTests/Fixtures/scenario/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['apps/macos/**', 'Sources/**', 'Package.swift', 'Tests/ZagonCoreTests/Fixtures/scenario/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

# a push and the pull request of the same branch share one group
concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Snapshots
        run: swift run Zagon --snapshots build/snapshots --fixtures ../../Tests/ZagonCoreTests/Fixtures/scenario
      # Build 1: below every release (release.yml numbers them by its own runs), so a CI DMG updates to the latest one.
      # The signed update zip and the appcast come only from release.yml, the one workflow with the Sparkle key.
      - name: App and DMG
        run: scripts/build-app.sh "0.1.0" "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: apps/macos/build/snapshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Zagon-dmg
          path: apps/macos/build/Zagon.dmg
